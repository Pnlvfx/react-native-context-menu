appId: contextmenu.example
---
- launchApp:
    clearState: true

# Trigger shows on screen
- assertVisible: "Hold me"

# Single tap fires onPress without opening context menu
- tapOn: "Hold me"
- assertVisible: "Button pressed"
- tapOn: "OK"

# Long press opens the context menu - assert all items visible once
- longPressOn: "Hold me"
- assertVisible: "Share"
- assertVisible: "Copy"
- assertVisible: "Delete"
- tapOn: "Share"
- assertVisible: "Share pressed"
- tapOn: "OK"

# Long press - tap Copy
- longPressOn: "Hold me"
- tapOn: "Copy"
- assertVisible: "Copy pressed"
- tapOn: "OK"

# Long press - tap Delete (destructive)
- longPressOn: "Hold me"
- tapOn: "Delete"
- assertVisible: "Delete pressed"
- tapOn: "OK"
